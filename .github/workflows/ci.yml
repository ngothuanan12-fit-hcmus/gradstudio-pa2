# The gates from CLAUDE.md, run with the same commands on every push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install the root tools
        run: npm ci

      - name: Install the client
        run: npm ci
        working-directory: client

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
